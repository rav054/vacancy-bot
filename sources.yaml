# Vacancy Bot - source and matching configuration
# Edit this file to add organisations, change keywords, or tune reminders.

settings:
  # Days before the last date on which you want to be reminded.
  reminder_days: [21, 14, 7, 3, 1, 0]
  # Minimum relevance score for an item to be kept (see keywords below).
  relevance_threshold: 3
  # Items whose last date passed more than this many days ago are archived.
  archive_after_days: 30
  # Keep at most this many headlines per news source per run.
  news_items_per_source: 6
  # Undated news leads older than this are dropped, so the board stays current.
  # Indian application windows run 3-6 weeks, so 45 days keeps live ones and
  # discards cycles that have almost certainly closed.
  news_lead_ttl_days: 45
  # Appended to every news query as Google News's `when:` operator. Without it
  # the feeds rank by relevance and are dominated by years-old stories.
  news_window: "45d"
  # How many undated notices to open per run, hunting for the real last date.
  enrich_budget: 20
  http_timeout: 30
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) VacancyBot/1.0"

profile:
  name: "Agriculture / Soil Science aspirant"
  qualifications:
    - "B.Sc. Agriculture"
    - "M.Sc. Soil Science"
    - "Ph.D. Soil Science"

