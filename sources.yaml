# Extra gate applied only to news_rss sources, which otherwise pick up press
# releases, results and listicles alongside actual vacancy announcements.
news_filter:
  # The headline must contain at least one of these.
  require:
    - recruitment
    - vacancy
    - vacancies
    - notification out
    - notification released
    - apply online
    - apply offline
    - applications invited
    - invites application
    - walk-in
    - walkin
    - registration begins
    - registration open
    - last date
    - advertisement
    - "posts out"
    - hiring
    - "notification 2026"
    - "notification 2027"
  # ...and none of these.
  exclude:
    - answer key
    - admit card
    - result out
    - result declared
    - results declared
    - exam date
    - exam schedule
    - exam analysis
    - cut off
    - cutoff
    - merit list
    - syllabus
    - previous year
    - mock test
    - question paper
    - salary structure
    - in hand salary
    - top colleges
    - best colleges
    - career scope
    - career options
    - list of competitive
    - list of exams
    - "why the degree"
    - paper leak
    - visits
    - celebrates
    - foundation day
    - signs mou
    - inks moa
    - interaction
    - consultation
    - training programme
    - workshop
    - webinar
    - awarded
    - felicitated
    - inaugurat
    - review meeting
    - excel in
    - demonstrated
    - "scope of agriculture"
    - counselling
    - admission
    - "how to prepare"
    - "preparation tips"
    - "study plan"
    - "books for"
    - placement
    - placements
    - "ace tests"
    - "exam city"
    - "city intimation"
    - "hall ticket"
    - "eligibility criteria"
    - "selection process"
    - "cheating racket"
    - arrests
    - "expected vacanc"
    - "posts expected"

# ---------------------------------------------------------------------------
# Sources.
#   parser:   isro_table | anchors | news_rss
#     anchors    - pulls every link on the page, matches link text
#     isro_table - parses the ISRO "Current Opportunities" table (real dates)
#     news_rss   - Google News RSS safety net for sites that need JavaScript
#   category: used for the dashboard filter
#     central | banking | psu | state | academia | research | fellowship |
#     private | international
#   insecure: true      - site serves a broken TLS chain; read it anyway
#   geo_restricted: true - the host answers from some networks and not others
#                          (several Indian government sites refuse non-Indian IPs,
#                          and some .icar.gov.in hosts do not resolve on Indian
#                          ISPs). A failure here is reported as a skip, not an
#                          error, because it depends on where the check ran.
# ---------------------------------------------------------------------------
sources:

  # ---------------- Space / remote sensing ----------------
  - id: isro
    org: "ISRO (incl. Space Applications Centre, Ahmedabad)"
    category: central
    parser: isro_table
    url: "https://www.isro.gov.in/ISRO_EN/ViewAllOpportunities.html"
    apply_page: "https://www.isro.gov.in/ISRO_EN/ViewAllOpportunities.html"
    checklist: isro
    boost_phrases: ["space applications centre", "sac"]

  - id: nrsc
    org: "NRSC Hyderabad (ISRO remote sensing)"
    category: central
    parser: anchors
    url: "https://www.nrsc.gov.in/"
    apply_page: "https://www.nrsc.gov.in/"
    checklist: isro
    link_must_match: ["advertisement no", "recruitment for", "recruitment to", "vacancy",
                      "applications are invited", "walk-in"]
    boost_phrases: ["remote sensing", "geospatial"]

  # ---------------- ICAR / agricultural research ----------------
  - id: asrb
    org: "ASRB / ICAR (ARS, NET, STO, Technical Assistant, RMP)"
    category: research
    parser: anchors
    url: "https://asrb.gov.in/"
    apply_page: "https://asrb.gov.in/"
    # asrb.gov.in serves an incomplete TLS chain; we only read its public notices.
    insecure: true
    checklist: icar
    link_must_match: ["notification", "advt", "vacancy", "recruitment", "examination"]

  - id: iisr
    org: "ICAR-IISR Kozhikode (also carries other ICAR notices)"
    category: research
    parser: anchors
    url: "https://www.spices.res.in/"
    apply_page: "https://www.spices.res.in/"
    checklist: icar
    link_must_match: ["vacancy", "recruitment", "walk-in", "walk in", "applications are invited",
                      "notification for the post", "engagement"]

  # The institute's own domain; iiss.icar.gov.in does not resolve from many ISPs.
  - id: iiss-bhopal
    org: "ICAR-IISS Bhopal (Indian Institute of Soil Science)"
    category: research
    parser: anchors
    url: "https://iiss.res.in/recruitment.php"
    apply_page: "https://iiss.res.in/recruitment.php"
    checklist: icar
    link_must_match: ["vacancy", "recruitment", "walk-in", "walk in", "advt", "notification",
                      "applications are invited", "post", "interview for"]
    boost_phrases: ["soil"]

    # The page is an archive, newest first; only the recent block matters.
    max_items: 30
  - id: iari
    org: "ICAR-IARI New Delhi"
    category: research
    parser: anchors
    url: "https://www.iari.res.in/"
    apply_page: "https://www.iari.res.in/"
